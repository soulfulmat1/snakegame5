
name: Snake Game 5 YouTube Live

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  youtube-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install streaming tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio
          ffmpeg -version
          google-chrome --version

      - name: Start virtual display and game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Xvfb :99 -screen 0 1080x1920x24 -ac +extension GLX +render -noreset &

          pulseaudio --start
          sleep 2

          pactl load-module module-null-sink sink_name=GameAudio sink_properties=device.description=GameAudio
          pactl set-default-sink GameAudio

          echo "Virtual game audio device started."
          sleep 3

          DISPLAY=:99 google-chrome \
            --no-sandbox \
            --no-first-run \
            --disable-dev-shm-usage \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --window-position=0,0 \
            --window-size=1080,1920 \
            --kiosk \
            https://soulfulmat1.github.io/snakegame4/ &

          sleep 15
          echo "Snake Game 4 browser is running."

          # ==================================================
          # AUTOMATIC NEXT WORKFLOW
          # ==================================================

          (
            echo "Automatic workflow restart timer started."

            sleep 20700

            echo "Requesting next YouTube Live workflow..."

            curl --fail-with-body \
              --request POST \
              --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/youtube-live.yml/dispatches" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --data '{"ref":"main"}'

            echo "Next workflow dispatch requested."
          ) &

          # ==================================================
          # FFMPEG STREAM + AUTOMATIC RECONNECT
          # ==================================================

          echo "Starting Snake Game 4 YouTube Live..."

          while true; do
            echo "Starting FFmpeg at $(date)"

            ffmpeg \
              -f x11grab \
              -framerate 30 \
              -video_size 1080x1920 \
              -i :99.0 \
              -f pulse \
              -i GameAudio.monitor \
              -c:v libx264 \
              -preset veryfast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -b:v 6800k \
              -maxrate 6800k \
              -bufsize 13600k \
              -g 60 \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -ac 2 \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_STREAM_KEY }}"

            EXIT_CODE=$?

            echo "FFmpeg stopped with exit code $EXIT_CODE"
            echo "Waiting 10 seconds before reconnecting..."

            sleep 10
          done
